[build]
  command = "npm run build"
  publish = "dist"

# Preserve the previous French About URL after the route folder rename.
[[redirects]]
  from = "/qui-sommes-nous"
  to = "/a-propos/"
  status = 301
  force = true

[[redirects]]
  from = "/qui-sommes-nous/*"
  to = "/a-propos/:splat"
  status = 301
  force = true

# Reuse bilingual Vite route shells for association slugs while preserving the
# requested path in the browser for direct links and language switching.
[[redirects]]
  from = "/en/associations/:slug"
  to = "/en/associations/index.html"
  status = 200

[[redirects]]
  from = "/en/associations/:slug/"
  to = "/en/associations/index.html"
  status = 200

[[redirects]]
  from = "/associations/:slug"
  to = "/associations/index.html"
  status = 200

[[redirects]]
  from = "/associations/:slug/"
  to = "/associations/index.html"
  status = 200

# Reuse the association shell for bilingual member directories and profiles.
[[redirects]]
  from = "/en/associations/:slug/members"
  to = "/en/associations/index.html"
  status = 200

[[redirects]]
  from = "/en/associations/:slug/members/"
  to = "/en/associations/index.html"
  status = 200

[[redirects]]
  from = "/en/associations/:slug/members/:member"
  to = "/en/associations/index.html"
  status = 200

[[redirects]]
  from = "/en/associations/:slug/members/:member/"
  to = "/en/associations/index.html"
  status = 200

[[redirects]]
  from = "/associations/:slug/members"
  to = "/associations/index.html"
  status = 200

[[redirects]]
  from = "/associations/:slug/members/"
  to = "/associations/index.html"
  status = 200

[[redirects]]
  from = "/associations/:slug/members/:member"
  to = "/associations/index.html"
  status = 200

[[redirects]]
  from = "/associations/:slug/members/:member/"
  to = "/associations/index.html"
  status = 200

# Keep client-side routes working if routes are added later.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
